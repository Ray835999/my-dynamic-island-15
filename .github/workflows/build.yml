name: Build DynamicIsland15

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and SDK
        run: |
          set -euo pipefail
          # 安装 Theos
          export THEOS=~/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          mkdir -p $THEOS/sdks

          # 安装 iOS 15.5 SDK：多个候选 URL + 重试，失败就用 Theos 自带 sdk-install.sh 兜底
          SDK_OUT=/tmp/sdk
          rm -f $SDK_OUT
          SDK_URLS=(
            "https://github.com/xybp888/iOS-SDKs/releases/download/1/iOS15.5.sdk.tar.xz"
            "https://github.com/xybp888/iOS-SDKs/releases/download/1.0.0/iOS15.5.sdk.tar.xz"
            "https://raw.githubusercontent.com/xybp888/iOS-SDKs/master/iOS15.5.sdk.tar.xz"
          )
          for url in "${SDK_URLS[@]}"; do
            echo "Trying SDK: $url"
            if curl --fail --retry 3 --retry-delay 2 -L -o "$SDK_OUT" "$url"; then
              # 检测实际格式：tar.xz / tar.gz / raw tar
              file "$SDK_OUT" || true
              if tar -tf "$SDK_OUT" >/dev/null 2>&1; then
                echo "Unpacking as plain tar..."
                tar -xf "$SDK_OUT" -C "$THEOS/sdks" && break
              elif command -v xz >/dev/null 2>&1 && xz -t "$SDK_OUT" 2>/dev/null; then
                echo "Unpacking as tar.xz via xz..."
                xz -dc "$SDK_OUT" | tar -xf - -C "$THEOS/sdks" && break
              elif tar -tzf "$SDK_OUT" >/dev/null 2>&1; then
                echo "Unpacking as tar.gz..."
                tar -xzf "$SDK_OUT" -C "$THEOS/sdks" && break
              fi
            fi
            echo "SDK candidate failed, trying next..."
            rm -f "$SDK_OUT"
          done

          # 兜底：用 Theos 官方脚本装 SDK
          if ! ls "$THEOS/sdks" | grep -qi "iOS15"; then
            echo "None of direct URLs worked, falling back to Theos sdk-install.sh"
            bash "$THEOS/bin/sdk-install.sh" 15.5 || bash "$THEOS/bin/sdk.sh" --download 15.5 || true
          fi

          echo "=== Installed SDKs ==="
          ls -la "$THEOS/sdks"

          # 安装 ldid（签名工具）和 dpkg（打包 deb）
          brew install ldid dpkg

      - name: Build
        run: |
          export THEOS=~/theos
          cd DynamicIsland15
          make clean package FINALPACKAGE=1
          # 把产物整理出来
          mkdir -p ../artifacts
          cp -v ../com.local.dynamicisland15_*_iphoneos-arm*.deb ../artifacts/ || cp -v ./packages/com.local.dynamicisland15_*_iphoneos-arm*.deb ../artifacts/ 2>/dev/null || true
          ls -la ../artifacts/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland15-deb
          path: |
            artifacts/*.deb
            DynamicIsland15/packages/*.deb
          if-no-files-found: error
